name: 'Update by stargazed'
# This workflow runs at 00:30 everyday
on:
  schedule:
    -
      cron: '30 0 * * *'
permissions:
  contents: write
jobs:
  build:
    name: 'stargazed update'
    runs-on: ubuntu-latest
    steps:
      -
        name: 'Use GitHub Actions'
        uses: actions/checkout@v6
      -
        name: 'Use Node.js 24.x'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      -
        name: 'Install Package'
        run: 'npm install --global stargazed'
      -
        name: 'Update Repo'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: 'stargazed --username "$GITHUB_REPOSITORY_OWNER" --token "$GITHUB_TOKEN" --repo "${GITHUB_REPOSITORY#*/}" --message "stargazed update by GitHub Actions Workflow" --sort'
